services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?Ange API_DOMAIN i api/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - country-quiz-api

  country-quiz-api:
    build: .
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
